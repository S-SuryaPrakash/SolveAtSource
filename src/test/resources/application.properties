# Tests use an isolated in-memory database; the application itself uses PostgreSQL.
spring.datasource.url=jdbc:h2:mem:resolvex;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Flyway creates the test schema too, keeping tests aligned with PostgreSQL migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
