spring.application.name=resolveX
server.port=8083

# PostgreSQL connection settings. Override these values through environment variables.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resolvex}
spring.datasource.username=${POSTGRES_USER:resolvex}
spring.datasource.password=${POSTGRES_PASSWORD}

# Development schema management. Flyway migrations will replace this in a later step.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
