spring.application.name=resolveX
server.port=8083

# PostgreSQL connection settings. Override these values through environment variables.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resolvex}
spring.datasource.username=${POSTGRES_USER:resolvex}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the database schema. Hibernate checks that entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

# JWT configuration. A later authentication step will validate that JWT_SECRET is set.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:resolvex-api}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# One-time first-administrator bootstrap. Keep disabled unless intentionally provisioning it.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
